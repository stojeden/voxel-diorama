name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  browser-smoke:
    name: Browser smoke and renderer budgets (Node 24)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds and signs in one step. `browserSmoke` verifies that signature and refuses
      # to measure anything else, so a plain `npm run build` leaves it with no manifest
      # to check and it stops before the first frame.
      #
      # The manifest goes into the workspace rather than the default tmpdir so it can travel
      # with the bundle: the deploy job checks the bytes it is about to publish against it.
      - name: Build and sign the bundle
        run: node scripts/prepareBuild.mjs
        env:
          BUILD_MANIFEST: ${{ github.workspace }}/build-manifest.json

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and renderer budgets
        run: node scripts/browserSmoke.mjs
        env:
          BUILD_MANIFEST: ${{ github.workspace }}/build-manifest.json

      # Every budget assertion and pixel comparison above applies to THIS bundle. Until
      # 2026-09-11 the deploy job built its own and published that instead, so none of it
      # covered what shipped.
      - name: Keep the measured bundle
        uses: actions/upload-artifact@v4
        with:
          name: measured-bundle
          path: |
            dist
            build-manifest.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy validated build to GitHub Pages
    needs:
      - validate
      - browser-smoke
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
      # Reading the artifact the browser-smoke job left behind.
      actions: read
    uses: ./.github/workflows/deploy.yml
